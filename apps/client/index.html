<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <!-- `viewport-fit=cover` : sans lui, `env(safe-area-inset-*)` vaut zéro et
         la barre de pouce passerait sous l'encoche. Non négociable n°10. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1A1F26" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Heroes of Might and Magic — Auvergne Edition : jeu de stratégie au tour par tour dans le Forez, des Bois Noirs à La Renaudie."
    />
    <title>Heroes of Might and Magic — Auvergne Edition</title>
    <!--
      LA CARTE DE PARTAGE — ce que voient les cousins quand le lien arrive.

      Le jeu se joue à cinq, en partageant une seule adresse : cette vignette
      est donc le premier contact de quatre joueurs sur cinq avec le Forez. Le
      teaser porte le titre, les cinq héros et trois noms de lieux, et il est en
      16:9 — on ne le ROGNE jamais, sous peine de couper un visage ou un nom.
      `og:image:width` et `og:image:height` sont là pour cela : un client qui
      connaît les dimensions cadre en boîte au lieu de deviner et de tailler.

      Les adresses sont écrites en RELATIF, ce qui suffit à un navigateur. Les
      robots d'aperçu, eux, exigent une adresse absolue : `apps/server/src/static.ts`
      les rend absolues au moment de servir la page, à partir de l'hôte de la
      requête — de sorte qu'aucun nom de domaine n'est écrit en dur nulle part.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Heroes of Might and Magic — Auvergne Edition" />
    <meta property="og:title" content="Heroes of Might and Magic — Auvergne Edition" />
    <meta
      property="og:description"
      content="Cinq bannières, un massif : le Forez, des Bois Noirs à La Renaudie. Ouvrez le lien, prenez une bannière, jouez quand vous voulez."
    />
    <meta property="og:image" content="/img/teaser/cousins.webp" />
    <meta property="og:image:type" content="image/webp" />
    <meta property="og:image:width" content="1672" />
    <meta property="og:image:height" content="941" />
    <meta
      property="og:image:alt"
      content="Les cinq héros du Forez devant un griffon, une vouivre, un colosse de granite et un sanglier cuirassé."
    />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/img/teaser/cousins.webp" />
    <!-- Le donjon de la Châtellenie, dessiné en SVG et embarqué en `data:` :
         aucun fichier, aucun CDN, et surtout aucune requête `/favicon.ico` en
         404 dans le journal de la console. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='p' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%234A4E52'/%3E%3Cstop offset='1' stop-color='%232A2C2F'/%3E%3C/linearGradient%3E%3ClinearGradient id='o' x1='0' y1='0' x2='0' y2='1'%3E%3Cstop offset='0' stop-color='%23F3DEA8'/%3E%3Cstop offset='1' stop-color='%239E7C1B'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='3' fill='url(%23p)'/%3E%3Cpath d='M6 26V10l5-4 5 4v5h5l5 4v7z' fill='%233A4657' opacity='.55'/%3E%3Cpath d='M7 25V11l4.5-3.6L16 11v5h5l4 3.2V25z' fill='url(%23o)'/%3E%3Cpath d='M13 25v-6h6v6z' fill='%236E1F2A'/%3E%3Cpath d='M7 11l4.5-3.6L16 11' fill='none' stroke='%23FFE9C2' stroke-opacity='.7' stroke-width='1.2'/%3E%3C/svg%3E"
    />
    <style>
      /* Fond de granit posé avant le premier octet de CSS applicatif : la page
         ne peut jamais apparaître blanche, même sur une connexion lente. */
      html,
      body {
        height: 100%;
        margin: 0;
        background-color: #1a1f26;
        color: #e8dcc0;
      }
      #root {
        min-height: 100%;
      }
      .amorce {
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 2rem;
        text-align: center;
        font-family: Georgia, 'Times New Roman', serif;
      }
      .amorce h1 {
        font-size: 1.15rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #c9a227;
        margin: 0 0 0.75rem;
      }
      .amorce p {
        margin: 0;
        color: #b9b09c;
        font-size: 1rem;
        line-height: 1.62;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Remplacé par React dès le premier rendu. -->
      <div class="amorce">
        <div>
          <h1>Heroes of Might and Magic — Auvergne Edition</h1>
          <p>On attelle le moteur du Forez…</p>
        </div>
      </div>
    </div>
    <noscript>
      <div class="amorce">
        <div>
          <h1>JavaScript est nécessaire</h1>
          <p>
            Le pays du Forez est dessiné en direct par votre navigateur : sans JavaScript, il ne
            peut pas être peint. Activez-le, puis rechargez la page.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
